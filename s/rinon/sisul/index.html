<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>리논</title>
<style>html,body{margin:0;background:#111;height:100%;overflow:hidden}img{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}</style>
<img src="/s/rinon/sisul/p.webp" alt="">
<script>
let x=0
function go(d){if(d<-48)location.href='/s/rinon/gage';else if(d>48)location.href='/s/rinon'}
addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true})
addEventListener('touchend',e=>go(e.changedTouches[0].clientX-x),{passive:true})
</script>
