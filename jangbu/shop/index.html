<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장부 · 가게</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.page{max-width:430px;margin:0 auto;min-height:100dvh}
.top{display:flex;justify-content:space-between;padding:16px 20px;font-size:13px;color:#9a9a9a;background:#f4f2ee}
.hero{position:relative;min-height:48vh;background:#0a0a0a}
.hero .tex{position:absolute;inset:0;background:linear-gradient(90deg,#0a0a0a 0%,#2a2a2a 78%,#0a0a0a 100%)}
.hero .demo{position:absolute;top:18px;right:18px;font-size:11px;color:#c8c8c8}
.rest{padding:28px 20px 48px}
.name{font-size:34px;font-weight:600}
.open{margin-top:10px;font-size:13px;color:#c8c8c8}
.treats{margin-top:22px;list-style:none}
.treats li{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #222}
.meta{margin-top:22px;color:#c8c8c8}
.btn{display:block;margin-top:18px;text-align:center;text-decoration:none;background:#fff;color:#111;padding:13px}
</style>
</head>
<body>
<main class="page">
  <div class="top"><span>장부 · 미리보기</span><span>예시</span></div>
  <section class="hero"><div class="tex"></div><span class="demo">예시</span></section>
  <div class="rest">
    <h1 class="name">이도</h1>
    <p>선의 가게</p>
    <p class="open">오늘 열림</p>
    <ul class="treats">
      <li><span>커트</span><span>45,000</span></li>
      <li><span>염색</span><span>문의</span></li>
      <li><span>펌</span><span>130,000</span></li>
      <li><span>상담</span><span>문의</span></li>
    </ul>
    <p class="meta">화–일 11:00–20:00 · 월요일 쉼</p>
    <a class="btn" href="/jangbu/attach">공개하기</a>
  </div>
</main>
</body>
</html>
