<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopcard</title>
<link rel="stylesheet" href="/t.css">
<style>
.pad{padding:64px 20px 120px}
.preview{margin:18px auto 0;width:min(248px,68vw);aspect-ratio:390/720;border-radius:22px;overflow:hidden;position:relative;background:#111}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.preview .veil{position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(180deg,transparent,rgba(8,8,10,.72))}
.preview .meta{position:absolute;left:14px;bottom:16px;z-index:1;color:#fff}
.preview .meta b{display:block;font-size:13px;font-weight:600;letter-spacing:-.02em}
.preview .meta span{display:block;margin-top:2px;font-size:11px;font-weight:400;opacity:.92}
.preview .ex{position:absolute;top:12px;right:12px;z-index:1;color:rgba(255,255,255,.72);font-size:9px}
.row{margin:16px 0 0;display:flex;gap:8px;justify-content:space-between}
.k{width:48px;height:48px;border:0;padding:0;border-radius:12px;overflow:hidden;background:#111;cursor:pointer;flex:0 0 48px}
.k img{width:100%;height:100%;object-fit:cover;display:block}
.k.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--blue)}
</style>
</head>
<body>
<main class="stage pad">
  <h1>이런 느낌으로 갈까요</h1>
  <div class="preview">
    <img id="hero" src="/p/black-studio.jpg" alt="리논" width="248" height="458">
    <div class="veil"></div>
    <p class="ex">예시</p>
    <p class="meta"><b>리논</b><span>성수</span><span>오늘 열림</span></p>
  </div>
  <div class="row" id="row">
    <button type="button" class="k on" data-src="/p/black-studio.jpg"><img src="/p/black-studio-chip.jpg" alt="" width="48" height="48"></button>
    <button type="button" class="k" data-src="/p/white-towel.jpg"><img src="/p/white-towel-chip.jpg" alt="" width="48" height="48"></button>
    <button type="button" class="k" data-src="/p/wood.jpg"><img src="/p/wood-chip.jpg" alt="" width="48" height="48"></button>
    <button type="button" class="k" data-src="/p/magazine.jpg"><img src="/p/magazine-chip.jpg" alt="" width="48" height="48"></button>
    <button type="button" class="k" data-src="/p/hangul.jpg"><img src="/p/hangul-chip.jpg" alt="" width="48" height="48"></button>
    <button type="button" class="k" data-src="/p/neon.jpg"><img src="/p/neon-chip.jpg" alt="" width="48" height="48"></button>
  </div>
  <a class="cta" href="/jangbu/facts">다음</a>
  <p class="foot">Shopcard</p>
</main>
<script>
const row=document.getElementById("row");
const hero=document.getElementById("hero");
row.addEventListener("click",e=>{
  const k=e.target.closest(".k"); if(!k) return;
  row.querySelectorAll(".k").forEach(x=>x.classList.toggle("on",x===k));
  hero.src=k.dataset.src;
});
</script>
</body>
</html>
