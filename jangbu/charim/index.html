<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f7f6f2;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.mid{max-width:430px;margin:0 auto;padding:36px 16px 64px}
h1{font-size:22px;font-weight:600;letter-spacing:-.03em;padding:0 4px}
.grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:block;text-decoration:none;min-height:120px;padding:18px 12px;border-radius:4px}
.card .look{font-size:13px;opacity:.65}
.card .name{margin-top:8px;font-size:20px}
.bs{background:#0a0a0a;color:#f4f4f4}
.wt{background:#f7f4ef;color:#1c1b19}
.wd{background:#efe6d8;color:#2a1f16}
.mg{background:#fff;color:#111}
.hg{background:#f2efe8;color:#141414}
.nn{background:#07080c;color:#f4f1ea}
.foot{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:10px;letter-spacing:.22em;color:#bbb}
</style>
</head>
<body>
  <main class="mid">
    <h1>이런 느낌으로 갈까요</h1>
    <div class="grid">
      <a class="card bs" href="/jangbu/facts"><span class="look">블랙스튜디오</span><p class="name">리논</p></a>
      <a class="card wt" href="/jangbu/facts"><span class="look">흰 타올</span><p class="name">리논</p></a>
      <a class="card wd" href="/jangbu/facts"><span class="look">나무 조명</span><p class="name">리논</p></a>
      <a class="card mg" href="/jangbu/facts"><span class="look">잡지 화보</span><p class="name">리논</p></a>
      <a class="card hg" href="/jangbu/facts"><span class="look">한글 간결</span><p class="name">리논</p></a>
      <a class="card nn" href="/jangbu/facts"><span class="look">밤 네온</span><p class="name">리논</p></a>
    </div>
  </main>
  <p class="foot">Shopcard</p>
</body>
</html>
