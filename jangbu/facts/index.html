<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100dvh; background: #f4f2ee; color: #111;
  font-family: "Noto Sans CJK KR", "Noto Sans KR", Pretendard, system-ui, -apple-system, sans-serif; }
.bar { display: flex; justify-content: space-between; padding: 22px 22px 0; font-size: 13px; color: #9a9a9a; }
.mid { padding: 22px 20px 56px; max-width: 430px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -.03em; }
.lead { margin-top: 6px; font-size: 13px; color: #8a8a8a; }
label { display: block; margin-top: 14px; font-size: 12px; color: #8a8a8a; }
input { width: 100%; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; padding: 10px 11px; font: inherit; background: #fff; }
.svc { list-style: none; margin-top: 8px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 4px 12px; }
.svc li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 15px; color: #111; }
.svc li:last-child { border-bottom: 0; }
.photo { margin-top: 8px; width: 96px; height: 128px; object-fit: cover; object-position: 55% 50%; border-radius: 4px; background: #111; }
.cta { display: block; margin-top: 28px; text-align: center; text-decoration: none; background: #111; color: #fff;
  border-radius: 6px; padding: 14px 16px; font-weight: 600; }
</style>
</head>
