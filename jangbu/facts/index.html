<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본점 · 사실</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f4f2ee;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.bar{display:flex;justify-content:space-between;padding:22px 20px 0;font-size:13px;color:#8a8a8a}
.mid{max-width:430px;margin:0 auto;padding:18px 20px 56px}
h1{font-size:22px;font-weight:600}
.lead{margin-top:6px;font-size:13px;color:#8a8a8a}
h2{margin-top:22px;font-size:13px;color:#8a8a8a;font-weight:500}
label{display:block;margin-top:12px;font-size:12px;color:#8a8a8a}
input{width:100%;margin-top:5px;border:1px solid #ddd;border-radius:8px;padding:10px 11px;font:inherit;background:#fff}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #e6e2dc;font-size:15px}
.row span{color:#8a8a8a}
.pic{margin-top:10px}
.pic img{display:block;width:100%;height:160px;object-fit:cover;object-position:55% 50%;background:#111;filter:saturate(.75) contrast(1.12) brightness(.92)}
.cta{display:block;margin-top:28px;text-align:center;text-decoration:none;background:#111;color:#fff;border-radius:6px;padding:14px 16px;font-weight:600}
</style>
</head>
<body>
  <div class="bar"><span>본점</span><span>예시</span></div>
  <main class="mid">
    <h1>사실</h1>
    <p class="lead">손님 페이지에 그대로 나갑니다.</p>
    <label>이름 <input value="이도" readonly></label>
    <label>한 줄 <input value="선의 가게" readonly></label>
    <label>시간 <input value="화–일 11:00–20:00 · 월요일 쉼" readonly></label>
    <label>주소 <input value="서울 성동구 성수동" readonly></label>
    <label>전화 <input value="0507-1234-5678" readonly></label>
    <h2>시술</h2>
    <p class="row">커트 <span>45,000</span></p>
    <p class="row">염색 <span>문의</span></p>
    <p class="row">펌 <span>130,000</span></p>
    <p class="row">상담 <span>문의</span></p>
    <h2>사진 한 장</h2>
    <div class="pic"><img src="data:image/jpeg;base64,PLACEHOLDER" alt="분위기"></div>
    <a class="cta" href="/jangbu/shop">저장</a>
  </main>
</body>
</html>
