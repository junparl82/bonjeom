<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopcard</title>
<link rel="stylesheet" href="/t.css">
<style>
.pad{padding:48px 16px 120px}
.card{padding:16px;margin-bottom:12px}
.row{padding:8px 0}
.in{
  display:block;width:100%;margin-top:6px;height:44px;padding:0 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--paper);
  font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--ink);outline:none
}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,.16)}
.in::placeholder{color:var(--quiet);font-weight:500}
.menu{margin-top:8px}
.menu li{display:flex;gap:8px;align-items:center;padding:6px 0;list-style:none}
.mn{flex:1}
.mp{width:104px;text-align:right;font-weight:500}
.del{
  flex:0 0 36px;height:36px;border:1px solid var(--line);border-radius:10px;
  background:var(--white);color:var(--mute);font-size:18px;line-height:1;cursor:pointer
}
.add{
  margin:8px 0 8px;height:40px;padding:0 14px;border:1px dashed var(--line);border-radius:10px;
  background:var(--white);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer
}
.sug{display:none;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.sug.on{display:flex}
.chip{
  height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer
}
.shot{margin-top:10px;position:relative;border-radius:14px;overflow:hidden;height:86px;background:#111}
.shot img{width:100%;height:100%;object-fit:cover;object-position:50% 58%;display:block}
.shot .ex{position:absolute;top:8px;right:10px;color:rgba(210,210,212,.9);font-size:9px}
</style>
</head>
<body>
<main class="stage pad">
  <section class="card">
    <div class="row">
      <label class="q" for="name">가게 이름이 뭐예요?</label>
      <input class="in" id="name" value="리논" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <label class="q" for="phone">전화 몇 번이에요?</label>
      <input class="in" id="phone" value="0507-1420-8831" inputmode="tel" autocomplete="off">
    </div>
    <div class="row">
      <label class="q" for="area">어디 있어요?</label>
      <input class="in" id="area" value="성수" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <label class="q" for="hours">몇 시에 열어요?</label>
      <input class="in" id="hours" value="화–일 11:00–20:00" autocomplete="off">
    </div>
    <div class="row">
      <label class="q" for="rest">언제 쉬어요?</label>
      <input class="in" id="rest" value="월 휴무" autocomplete="off">
    </div>
  </section>
  <section class="card">
    <p class="q">뭐 하세요?</p>
    <ul class="menu" id="menu"></ul>
    <button type="button" class="add" id="add">+추가</button>
    <div class="sug" id="sug"></div>
  </section>
  <section class="card">
    <p class="q">가게 사진</p>
    <div class="shot"><img id="shot" src="/p/black-studio.jpg" alt="가게 사진" width="326" height="86"><span class="ex">예시</span></div>
  </section>
  <a class="cta" id="save" href="/s/rinon">저장</a>
  <p class="foot">Shopcard</p>
</main>
<script>
const MAP={"리논":"rinon","하루":"haru"};
const PACK={
  "리논":{phone:"0507-1420-8831",area:"성수",hours:"화–일 11:00–20:00",rest:"월 휴무",
    menu:[["커트","45,000"],["염색","문의"],["펌","130,000"],["상담","문의"]]},
  "하루":{phone:"0507-1834-2201",area:"연남",hours:"화–일 11:00–20:00",rest:"월 휴무",
    menu:[["커트","38,000"],["염색","90,000"],["펌","110,000"],["클리닉","70,000"]]}
};
const START={
  hair:["커트","염색","펌","상담"],
  nail:["케어","젤네일","연장","아트"],
  lash:["연장","리무브","펌","케어"],
  skin:["기본관리","필링","여드름","상담"]
};
const EXTRA={hair:["클리닉"],nail:[],lash:[],skin:[]};
function upjong(){
  try{return localStorage.getItem("shopcard.upjong")||"hair"}catch(e){return "hair"}
}
function slugFromName(name){
  const t=String(name||"").trim();
  if(!t) return "";
  if(MAP[t]) return MAP[t];
  const latin=t.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"").replace(/-+/g,"-").replace(/^-|-$/g,"");
  if(latin) return latin;
  let h=2166136261;
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}
  return "shop"+(h>>>0).toString(36).slice(0,6);
}
const menuEl=document.getElementById("menu");
function clearMenu(){menuEl.innerHTML=""}
function addRow(name,price){
  const li=document.createElement("li");
  li.innerHTML='<input class="in mn" autocomplete="off" spellcheck="false"><input class="in mp" inputmode="decimal" autocomplete="off"><button type="button" class="del" aria-label="지우기">×</button>';
  li.querySelector(".mn").value=name||"";
  li.querySelector(".mp").value=price||"문의";
  li.querySelector(".del").onclick=()=>{li.remove();syncAdd()};
  li.querySelector(".mp").addEventListener("focus",e=>{
    if(e.target.value==="문의") e.target.value="";
  });
  li.querySelector(".mp").addEventListener("blur",e=>{
    if(!e.target.value.trim()) e.target.value="문의";
  });
  menuEl.appendChild(li);
}
function extrasLeft(){
  const key=nameEl.value.trim();
  if(key==="리논"||key==="하루") return [];
  const have=new Set(services().map(x=>x.name));
  return (EXTRA[upjong()]||[]).filter(x=>!have.has(x));
}
function syncAdd(){
  const more=extrasLeft();
  document.getElementById("add").style.display=more.length?"inline-flex":"none";
  if(!more.length) sugEl.classList.remove("on");
}
function seedMenu(name){
  const key=String(name||"").trim();
  clearMenu();
  if(PACK[key]){PACK[key].menu.forEach(([n,p])=>addRow(n,p));syncAdd();return}
  (START[upjong()]||START.hair).forEach(n=>addRow(n,"문의"));
  syncAdd();
}
function applyPack(name){
  const key=String(name||"").trim();
  const p=PACK[key];
  if(p){
    document.getElementById("phone").value=p.phone;
    document.getElementById("area").value=p.area;
    document.getElementById("hours").value=p.hours;
    document.getElementById("rest").value=p.rest;
  }else{
    document.getElementById("phone").value="";
    document.getElementById("area").value="";
    document.getElementById("hours").value="";
    document.getElementById("rest").value="";
  }
  seedMenu(name);
}
function services(){
  return [...menuEl.querySelectorAll("li")].map(li=>{
    name:li.querySelector(".mn").value.trim(),
    price:li.querySelector(".mp").value.trim()
  })).filter(x=>x.name);
}
function collect(){
  const name=(document.getElementById("name").value||"").trim();
  const chair=(()=>{try{return localStorage.getItem("shopcard.chair")||"/p/black-studio.jpg"}catch(e){return "/p/black-studio.jpg"}})();
  return {name,phone:document.getElementById("phone").value.trim(),area:document.getElementById("area").value.trim(),hours:document.getElementById("hours").value.trim(),rest:document.getElementById("rest").value.trim(),services:services(),photo:chair,slug:slugFromName(name)};
}
const save=document.getElementById("save");
const nameEl=document.getElementById("name");
const sugEl=document.getElementById("sug");
function syncHref(){const s=slugFromName(nameEl.value);save.href=s?"/s/"+s:"#"}
applyPack(nameEl.value);
try{
  const shop=JSON.parse(localStorage.getItem("shopcard.shop")||"null");
  if(shop&&shop.name&&shop.name===nameEl.value&&shop.name!=="리논"&&shop.name!=="하루"){
    if(shop.phone) document.getElementById("phone").value=shop.phone;
    if(shop.area) document.getElementById("area").value=shop.area;
    if(shop.hours) document.getElementById("hours").value=shop.hours;
    if(shop.rest) document.getElementById("rest").value=shop.rest;
    if(shop.services&&shop.services.length){clearMenu();shop.services.forEach(x=>addRow(x.name,x.price||"문의"))}
  }
  const chair=localStorage.getItem("shopcard.chair");
  if(chair) document.getElementById("shot").src=chair;
}catch(e){}
syncHref();
nameEl.addEventListener("input",()=>{applyPack(nameEl.value);syncHref()});
document.getElementById("add").onclick=()=>{
  const more=extrasLeft();
  if(!more.length) return;
  sugEl.classList.toggle("on");
  sugEl.innerHTML="";
  more.forEach(label=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=label;
    b.onclick=()=>{addRow(label,"문의");sugEl.classList.remove("on");syncAdd()};
    sugEl.appendChild(b);
  });
};
save.addEventListener("click",async e=>{
  e.preventDefault();
  const shop=collect();
  if(!shop.slug) return;
  const LOCK={rinon:"리논",haru:"하루"};
  if(LOCK[shop.slug] && LOCK[shop.slug]!==shop.name) return;
  if(!LOCK[shop.slug] && (shop.name==="리논"||shop.name==="하루")) return;
  const body={slug:shop.slug,name:shop.name,phone:shop.phone,place:shop.area,hours:shop.hours,rest:shop.rest,treatments:shop.services.map(x=>(x.name+" "+x.price).trim())};
  try{localStorage.setItem("shopcard.shop",JSON.stringify(shop))}catch(err){}
  try{const r=await fetch("/api/shop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok) return}catch(err){return}
  location.href="/s/"+shop.slug;
});
</script>
</body>
</html>
