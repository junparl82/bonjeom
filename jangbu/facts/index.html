<title>본점 · 사실</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f7f6f2;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.bar{display:flex;justify-content:space-between;padding:22px 20px 0;font-size:13px;color:#8a8a8a}
.mid{max-width:430px;margin:0 auto;padding:18px 20px 56px}
h1{font-size:22px;font-weight:600}
.lead{margin-top:6px;font-size:13px;color:#8a8a8a}
h2{margin-top:22px;font-size:13px;color:#8a8a8a;font-weight:500}
label{display:block;margin-top:12px;font-size:12px;color:#8a8a8a}
input{width:100%;margin-top:5px;border:1px solid #ddd;border-radius:8px;padding:10px 11px;font:inherit;background:#fff}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #e6e2dc;font-size:15px}
.row span{color:#8a8a8a}
.pic{margin-top:10px}
.pic img{display:block;width:100%;height:160px;object-fit:cover;background:#111;filter:saturate(.55) contrast(1.18) brightness(.86)}
.cta{display:block;margin-top:28px;text-align:center;text-decoration:none;background:#111;color:#fff;border-radius:6px;padding:14px 16px;font-weight:600}
#ok{display:none;margin-top:14px;text-align:center;font-size:14px;color:#8a8a8a}
#ok:target{display:block}
</style>
</head>
