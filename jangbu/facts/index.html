<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopcard</title>
<link rel="stylesheet" href="/t.css">
<style>
body{background:#f2f4f6}
.pad{padding:50px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;margin-bottom:10px}
.q{display:block;font-size:12px;color:var(--mute);margin-top:14px}
.card .q:first-child{margin-top:0}
.a,.card input,.card textarea{display:block;width:100%;margin-top:4px;font:700 22px/1.25 Pretendard,system-ui,sans-serif;letter-spacing:-.03em;border:0;background:transparent;color:inherit}
.card textarea{font-size:15px;font-weight:600;resize:none;min-height:88px}
.shot{margin-top:10px;position:relative;border-radius:12px;overflow:hidden;height:86px;background:#111}
.shot img{width:100%;height:100%;object-fit:cover;object-position:50% 58%;display:block}
.shot .ex{position:absolute;top:8px;right:10px;color:rgba(210,210,212,.9);font-size:9px}
</style>
</head>
<body>
<main class="stage pad">
  <section class="card">
    <label class="q">가게 이름이 뭐예요?</label>
    <input id="name" class="a" value="하루">
    <label class="q">전화 몇 번이에요?</label>
    <input id="phone" class="a" value="0507-1420-8831">
    <label class="q">어디 있어요?</label>
    <input id="place" class="a" value="연남">
  </section>
  <section class="card">
    <label class="q">몇 시에 열어요?</label>
    <input id="hours" class="a" value="화–일 11:00–20:00">
    <label class="q">언제 쉬어요?</label>
    <input id="rest" class="a" value="월 휴무">
  </section>
  <section class="card">
    <label class="q">뭐 하세요?</label>
    <textarea id="treats">커트 45,000
염색 문의
펌 130,000
상담 문의</textarea>
  </section>
  <section class="card">
    <p class="q">가게 사진</p>
    <div class="shot"><img src="/p/black-studio.jpg" alt="" width="326" height="86"><span class="ex">예시</span></div>
  </section>
  <a class="cta" href="#" id="save">저장</a>
  <p class="foot">Shopcard</p>
</main>
<script>
function slugify(n){
  n=(n||'').trim()
  const map={리논:'rinon',하루:'haru'}
  let s=map[n]||n.toLowerCase().replace(/\s+/g,'-')
  s=s.replace(/[^a-z0-9가-힣-]/g,'')
  if(!s||s==='rinon'||s==='_t') s='shop'
  return s.slice(0,32)
}
save.onclick=async e=>{
  e.preventDefault()
  const shop={
    name:name.value.trim()||'가게',
    phone:phone.value.trim(),
    place:place.value.trim(),
    hours:hours.value.trim(),
    rest:rest.value.trim(),
    treatments:treats.value.split('\n').map(s=>s.trim()).filter(Boolean)
  }
  const slug=slugify(shop.name)
  shop.slug=slug
  try{localStorage.setItem('shop:'+slug,JSON.stringify(shop))}catch{}
  try{await fetch('/api/shop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(shop)})}catch{}
  location.href='/s/'+encodeURIComponent(slug)
}
</script>
</body>
</html>
