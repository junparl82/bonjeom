<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f7f6f2;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.mid{max-width:430px;margin:0 auto;padding:36px 20px 80px}
label{display:block;margin-top:18px;font-size:16px;font-weight:600}
input{display:block;width:100%;margin-top:8px;border:0;border-bottom:1px solid #ddd;background:transparent;padding:10px 0;font:inherit;font-size:16px}
button{display:block;width:100%;margin-top:32px;border:0;background:#111;color:#fff;padding:16px;font:inherit;font-weight:600;font-size:15px}
.foot{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:10px;letter-spacing:.22em;color:#bbb}
</style>
</head>
<body>
  <main class="mid">
    <form action="/s/rinon" method="get">
      <label>가게 이름이 뭐예요?<input name="name" value="리논"></label>
      <label>전화 몇 번이에요?<input name="phone" inputmode="tel"></label>
      <label>어디 있어요?<input name="addr"></label>
      <label>몇 시에 열어요?<input name="open" value="11:00"></label>
      <label>언제 쉬어요?<input name="off" value="월요일"></label>
      <label>뭐 하세요?<input name="do" value="커트"></label>
      <button type="submit">저장</button>
    </form>
  </main>
  <p class="foot">Shopcard</p>
</body>
</html>
