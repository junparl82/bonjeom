<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f4f2ee;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.mid{padding:36px 18px 64px;max-width:430px;margin:0 auto}
.slot{margin-top:16px;background:#fff;border-radius:10px;padding:14px 16px}
.slot header{font-size:13px;color:#9a9a9a;margin-bottom:8px}
.slot p{font-size:15px;line-height:1.55}
.foot{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:10px;letter-spacing:.22em;color:#bbb}
</style>
</head>
<body>
  <main class="mid">
    <section class="slot"><header>인스타</header><p>가게 명함 보내드릴게요. ○○</p></section>
  </main>
  <p class="foot">Shopcard</p>
</body>
</html>
