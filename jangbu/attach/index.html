<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장부 · 붙이기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f4f2ee;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.bar{display:flex;justify-content:space-between;padding:22px 22px 0;font-size:13px;color:#9a9a9a}
.mid{padding:22px 18px 48px;max-width:430px;margin:0 auto}
h1{font-size:22px;font-weight:600}
.slot{margin-top:12px;background:#fff;border-radius:10px;padding:14px 16px}
.slot header{font-size:13px;color:#9a9a9a;margin-bottom:10px}
.slot p{font-size:15px;line-height:1.55;font-weight:500}
</style>
</head>
<body>
  <div class="bar"><span>장부</span><span>예시</span></div>
  <main class="mid">
    <h1>붙이기</h1>
    <section class="slot"><header>플레이스 홈</header><p>ido.bonjeom.kr</p></section>
    <section class="slot"><header>플레이스 SNS</header><p>우리 본점 보내드릴게요.</p><p>ido.bonjeom.kr</p></section>
    <section class="slot"><header>카카오맵</header><p>ido.bonjeom.kr</p></section>
    <section class="slot"><header>카톡</header><p>이도입니다.</p><p>우리 본점 보내드릴게요.</p><p>ido.bonjeom.kr</p></section>
    <section class="slot"><header>인스타</header><p>우리 본점 보내드릴게요. ido.bonjeom.kr</p></section>
  </main>
</body>
</html>
