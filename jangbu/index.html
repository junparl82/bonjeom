<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopcard</title>
<link rel="stylesheet" href="/t.css">
<style>
.pad{padding:64px 20px 120px}
.g{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.c{position:relative;aspect-ratio:167/248;border:0;padding:0;border-radius:16px;overflow:hidden;background:#111;cursor:pointer}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c:after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(180deg,transparent,rgba(12,12,14,.58))}
.c span{position:absolute;left:0;right:0;bottom:12px;z-index:1;text-align:center;color:#fff;font-size:12px}
.c.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--blue)}
</style>
</head>
<body>
<main class="stage pad">
  <h1>어떤 가게예요</h1>
  <div class="g" id="g">
    <button type="button" class="c on" data-id="hair"><img src="/p/hair.jpg" alt="헤어" width="167" height="248"><span>헤어</span></button>
    <button type="button" class="c" data-id="nail"><img src="/p/nail.jpg" alt="네일" width="167" height="248"><span>네일</span></button>
    <button type="button" class="c" data-id="lash"><img src="/p/lash.jpg" alt="속눈썹" width="167" height="248"><span>속눈썹</span></button>
    <button type="button" class="c" data-id="skin"><img src="/p/skin.jpg" alt="피부" width="167" height="248"><span>피부</span></button>
  </div>
  <a class="cta" href="/jangbu/charim">다음</a>
  <p class="foot">Shopcard</p>
</main>
<script>
const g=document.getElementById("g");
g.addEventListener("click",e=>{
  const c=e.target.closest(".c"); if(!c) return;
  g.querySelectorAll(".c").forEach(x=>x.classList.toggle("on",x===c));
});
</script>
</body>
</html>
