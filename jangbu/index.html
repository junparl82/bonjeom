<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f7f6f2;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.mid{max-width:430px;margin:0 auto;padding:36px 20px 64px}
h1{font-size:22px;font-weight:600;letter-spacing:-.03em}
.grid{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;text-decoration:none;color:#111;background:#fff;border-radius:4px;padding:28px 16px;text-align:center;font-size:20px;font-weight:600}
.foot{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:10px;letter-spacing:.22em;color:#bbb}
</style>
</head>
<body>
  <main class="mid">
    <h1>어떤 가게예요.</h1>
    <div class="grid">
      <a class="card" href="/jangbu/charim">헤어</a>
      <a class="card" href="/jangbu/charim">네일</a>
      <a class="card" href="/jangbu/charim">속눈썹</a>
      <a class="card" href="/jangbu/charim">피부</a>
    </div>
  </main>
  <p class="foot">Shopcard</p>
</body>
</html>
