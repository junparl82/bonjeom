<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본점 · 업종</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f7f6f2;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.bar{display:flex;justify-content:space-between;padding:22px 20px 0;font-size:13px;color:#8a8a8a}
.mid{max-width:430px;margin:0 auto;padding:18px 20px 48px}
h1{font-size:22px;font-weight:600;letter-spacing:-.03em}
.grid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;text-decoration:none;overflow:hidden;min-height:268px;position:relative}
.ph{display:block;height:118px;background:#0a0a0a}
.card.dark{background:#0a0a0a;color:#f4f4f4}
.card.light{background:#f7f4ef;color:#1c1b19}
.ex{position:absolute;top:10px;left:12px;font-size:11px;color:#8a8680}
.tag{padding:12px 12px 0;font-size:22px;font-weight:600;letter-spacing:-.03em}
.open{padding:4px 12px 0;font-size:12px;color:#8a8a8a}
.dark .open{color:#a0a0a0}
.svc{display:flex;justify-content:space-between;padding:10px 12px 0;font-size:12px}
.svc span{color:#8a8a8a}
.btn{margin:16px 12px 14px;display:block;text-align:center;border:1px solid currentColor;padding:7px 0;font-size:12px}
</style>
</head>
<body>
  <div class="bar"><span>본점</span><span>예시</span></div>
  <main class="mid">
    <h1>어느 가게예요</h1>
    <div class="grid">
      <a class="card dark" href="/jangbu/charim"><span class="ph"></span><p class="tag">헤어</p><p class="open">오늘 열림</p><p class="svc">커트<span>45,000</span></p><span class="btn">전화</span></a>
      <a class="card light" href="/jangbu/charim"><span class="ex">예시</span><p class="tag" style="margin-top:28px">네일</p><p class="open">오늘 열림</p><p class="svc">젤<span>55,000</span></p><span class="btn">전화</span></a>
      <a class="card dark" href="/jangbu/charim"><span class="ph"></span><p class="tag">속눈썹</p><p class="open">오늘 열림</p><p class="svc">연장<span>70,000</span></p><span class="btn">전화</span></a>
      <a class="card light" href="/jangbu/charim"><span class="ex">예시</span><p class="tag" style="margin-top:28px">피부</p><p class="open">오늘 열림</p><p class="svc">관리<span>80,000</span></p><span class="btn">전화</span></a>
    </div>
  </main>
</body>
</html>
