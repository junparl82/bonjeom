<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f4f2ee;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.mid{min-height:100dvh;display:grid;place-content:center;place-items:center;gap:28px;padding:40px 28px 80px}
h1{font-size:22px;font-weight:600;letter-spacing:-.03em;text-align:center}
.kakao{display:block;width:min(320px,86vw);border:0;border-radius:6px;background:#fee500;color:#191919;
  font:inherit;font-size:16px;font-weight:600;padding:16px 20px;text-align:center;text-decoration:none}
.foot{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:10px;letter-spacing:.22em;color:#bbb}
</style>
</head>
<body>
  <div class="mid">
    <h1>카카오로 들어가요.</h1>
    <a class="kakao" href="/jangbu">카카오</a>
  </div>
  <p class="foot">Shopcard</p>
</body>
</html>
