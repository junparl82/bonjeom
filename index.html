<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f4f2ee;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.mid{padding:56px 24px 56px;max-width:430px;margin:0 auto;text-align:center}
h1{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.35}
.one{margin-top:16px;font-size:15px;line-height:1.55;color:#555}
.no{margin-top:22px;font-size:14px;line-height:1.55;color:#8a8a8a}
.cta{display:block;margin-top:32px;text-align:center;text-decoration:none;background:#111;color:#fff;
  border-radius:4px;padding:16px 18px;font-weight:600;font-size:15px}
.foot{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:10px;letter-spacing:.22em;color:#bbb}
</style>
</head>
<body>
  <main class="mid">
    <h1>가게 명함 보내드릴게요.</h1>
    <p class="one">손님이 홈페이지 있냐고 하면 이 주소를 주세요.</p>
    <p class="no">뷰티샵만 받아요. 카페, 식당, 병원, 학원은 안 해요.</p>
    <a class="cta" href="/login">시작하기</a>
  </main>
  <p class="foot">Shopcard</p>
</body>
</html>
