<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopcard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:#f4f2ee;color:#111;font-family:Pretendard,system-ui,-apple-system,sans-serif}
.wrap{max-width:390px;margin:0 auto;padding:52px 22px 72px}
h1{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.3}
.sub{margin-top:10px;font-size:14px;line-height:1.5;color:#6b6b6b}
.phone{display:block;width:168px;height:344px;margin:28px auto 0;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.note{margin-top:22px;font-size:14px;line-height:1.55;color:#6b6b6b}
.cta{display:block;margin-top:28px;text-align:center;text-decoration:none;background:#2f6bff;color:#fff;border-radius:12px;padding:16px 18px;font-weight:700;font-size:16px}
.foot{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:11px;letter-spacing:.18em;color:#c0c0c0}
</style>
</head>
<body>
  <main class="wrap">
    <h1>가게 명함 보내드릴게요.</h1>
    <p class="sub">손님이 홈페이지 있냐고 하면 이 주소를 주세요.</p>
    <a class="phone" href="/s/rinon"><img src="/s/rinon/p.webp" alt="리논" width="168" height="344"></a>
    <p class="note">뷰티샵만 받아요.<br>카페, 식당, 병원, 학원은 안 해요.</p>
    <a class="cta" href="/login">시작하기.</a>
  </main>
  <p class="foot">Shopcard</p>
</body>
</html>
